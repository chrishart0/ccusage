<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Usage report · ccusage</title>
		<style>
			:root {
				color-scheme: light;
				--paper: #edf2f8;
				--ink: #18314a;
				--muted: #586c83;
				--line: #dce5ef;
				--blue: #2369d8;
				--teal: #12877b;
				--violet: #a76dc2;
				--orange: #d68838;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--paper);
				color: var(--ink);
				font:
					14px/1.5 'Avenir Next',
					'Segoe UI',
					sans-serif;
			}
			main {
				max-width: 1160px;
				margin: 32px auto;
				padding: 0 24px;
			}
			header {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				gap: 20px;
				margin-bottom: 20px;
			}
			h1 {
				font-size: 26px;
				letter-spacing: -0.8px;
				margin: 0;
				font-weight: 650;
			}
			h2 {
				font-size: 16px;
				margin: 0;
			}
			p {
				margin: 5px 0;
				color: var(--muted);
			}
			.brand {
				font:
					12px ui-monospace,
					'SFMono-Regular',
					monospace;
				color: var(--blue);
				margin-bottom: 4px;
			}
			.range {
				font:
					12px ui-monospace,
					monospace;
				text-align: right;
			}
			.summary {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 1px;
				background: var(--line);
				border: 1px solid var(--line);
				border-radius: 10px;
				overflow: hidden;
				margin-bottom: 18px;
			}
			.stat {
				background: white;
				padding: 16px 20px;
			}
			.stat span {
				display: block;
				color: var(--muted);
				font-size: 12px;
			}
			.stat strong {
				font-size: 27px;
				font-weight: 600;
				letter-spacing: -1px;
				font-variant-numeric: tabular-nums;
			}
			.panel {
				background: white;
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 20px;
				margin-bottom: 18px;
			}
			.toolbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				flex-wrap: wrap;
				gap: 12px;
			}
			.controls {
				display: flex;
				align-items: center;
				gap: 12px;
				flex-wrap: wrap;
			}
			label {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: 12px;
				color: var(--muted);
			}
			select,
			button {
				font: inherit;
				color: var(--ink);
				background: white;
				border: 1px solid var(--line);
				border-radius: 5px;
				padding: 7px 9px;
			}
			select {
				max-width: 220px;
			}
			button {
				cursor: pointer;
			}
			.tabs {
				display: flex;
				gap: 3px;
				background: var(--paper);
				padding: 3px;
				border-radius: 7px;
			}
			.tabs button {
				border: 0;
				background: transparent;
				padding: 6px 12px;
				font-size: 12px;
			}
			.tabs button[aria-pressed='true'] {
				background: white;
				color: var(--blue);
				box-shadow: 0 1px 3px #18314a20;
			}
			button:focus-visible,
			select:focus-visible,
			rect:focus-visible {
				outline: 3px solid var(--blue);
				outline-offset: 2px;
			}
			.chart-wrap {
				position: relative;
				margin: 16px 0 4px;
			}
			svg {
				display: block;
				width: 100%;
				height: auto;
				min-height: 190px;
			}
			.legend {
				display: flex;
				flex-wrap: wrap;
				gap: 8px 18px;
				font-size: 11px;
				color: var(--muted);
				min-height: 22px;
			}
			.key {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				max-width: 100%;
			}
			.swatch {
				display: inline-block;
				width: 8px;
				height: 8px;
				border-radius: 2px;
				flex: none;
			}
			.split {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 18px;
			}
			.split .panel {
				min-width: 0;
			}
			.table-wrap {
				max-height: 306px;
				overflow: auto;
				margin-top: 10px;
			}
			table {
				width: 100%;
				border-collapse: collapse;
				font-size: 12px;
			}
			th {
				position: sticky;
				top: 0;
				background: white;
				text-align: left;
				color: var(--muted);
				font-weight: 500;
				padding: 7px 0;
				border-bottom: 1px solid var(--line);
				z-index: 1;
			}
			td {
				padding: 9px 0;
				border-bottom: 1px solid #edf2f8;
				vertical-align: top;
			}
			td:first-child {
				overflow-wrap: anywhere;
				padding-right: 10px;
			}
			td.num,
			th.num {
				text-align: right;
				white-space: nowrap;
				font-variant-numeric: tabular-nums;
				padding-left: 12px;
			}
			.bar {
				height: 3px;
				background: var(--paper);
				margin-top: 5px;
				max-width: 200px;
			}
			.bar i {
				height: 3px;
				display: block;
				background: var(--blue);
				border-radius: 3px;
			}
			.split section:nth-child(2) .bar i {
				background: var(--teal);
			}
			.note {
				font-size: 11px;
				max-width: 900px;
				margin: 6px 0 24px;
			}
			.empty {
				padding: 65px 12px;
				text-align: center;
				color: var(--muted);
			}
			footer {
				font-size: 11px;
				color: var(--muted);
				display: flex;
				justify-content: space-between;
				gap: 16px;
			}
			.chart-caption {
				font-size: 11px;
				color: var(--muted);
				margin-bottom: 10px;
			}
			noscript {
				display: block;
				padding: 25px;
				background: white;
			}
			@media (max-width: 700px) {
				main {
					margin: 18px auto;
					padding: 0 14px;
				}
				header {
					display: block;
				}
				.summary {
					grid-template-columns: repeat(2, 1fr);
				}
				.stat {
					padding: 12px 15px;
				}
				.stat strong {
					font-size: 24px;
				}
				.split {
					grid-template-columns: 1fr;
					gap: 0;
				}
				.panel {
					padding: 14px;
				}
				.range {
					max-width: none;
					text-align: left;
					margin-top: 8px;
				}
				.controls {
					gap: 8px;
				}
				select {
					max-width: 165px;
				}
				.toolbar {
					align-items: flex-start;
				}
				.chart-wrap {
					overflow-x: auto;
				}
				svg {
					min-width: 500px;
				}
				.note {
					font-size: 11px;
				}
			}
			@media print {
				body {
					background: white;
				}
				main {
					margin: 0;
					max-width: none;
				}
				.panel,
				.summary {
					break-inside: avoid;
				}
				.table-wrap {
					max-height: none;
					overflow: visible;
				}
				footer button {
					display: none;
				}
				.controls select {
					border: none;
					padding: 0;
				}
				.split {
					gap: 10px;
				}
				.panel {
					padding: 12px;
				}
				svg {
					min-width: 0;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<div>
					<div class="brand">ccusage / activity</div>
					<h1>Usage over time</h1>
				</div>
				<div class="range" id="range"></div>
			</header>
			<section class="summary" aria-label="Report totals">
				<div class="stat"><span>Total tokens</span><strong id="tokens">—</strong></div>
				<div class="stat"><span>Total cost · USD</span><strong id="cost">—</strong></div>
				<div class="stat"><span>Active days</span><strong id="days">—</strong></div>
				<div class="stat"><span>Sources / models</span><strong id="sources">—</strong></div>
			</section>
			<section class="panel">
				<div class="toolbar">
					<div class="tabs" aria-label="Chart breakdown">
						<button aria-pressed="true" data-view="total">Total</button
						><button aria-pressed="false" data-view="agent">By agent</button
						><button aria-pressed="false" data-view="model">By model</button>
					</div>
					<div class="controls">
						<label
							>Measure<select id="metric">
								<option value="tokens">Tokens</option>
								<option value="cost">Cost (USD)</option>
							</select></label
						><label
							>Group<select id="group">
								<option value="day">Day</option>
								<option value="week">Week</option>
								<option value="month">Month</option>
							</select></label
						><label
							>Source<select id="source">
								<option value="">All sources</option>
							</select></label
						>
					</div>
				</div>
				<div class="chart-wrap" id="chart"></div>
				<div class="chart-caption" id="caption"></div>
				<div class="legend" id="legend"></div>
			</section>
			<div class="split">
				<section class="panel">
					<h2>By agent</h2>
					<div class="table-wrap" id="agents"></div>
				</section>
				<section class="panel">
					<h2>By model</h2>
					<div class="table-wrap" id="models"></div>
				</section>
			</div>
			<p class="note" id="note"></p>
			<footer>
				<span
					>Saved snapshot · includes local, SSH, and configured Platform sources. Source totals are
					additive; the same requests may appear in agent logs and Platform billing.</span
				><button id="print">Print / save PDF</button>
			</footer>
			<noscript
				>Enable JavaScript to display this report. All report data is embedded in this file; no
				network connection is needed.</noscript
			>
		</main>
		<script type="application/json" id="report-data">
			__CCUSAGE_DATA__
		</script>
		<script>
			'use strict';
			const data = JSON.parse(document.getElementById('report-data').textContent);
			const $ = (id) => document.getElementById(id),
				colors = ['#2369d8', '#12877b', '#a76dc2', '#d68838', '#6579a2', '#c06f86', '#9ba9bc'];
			const compact = (n) =>
				new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 }).format(n);
			const money = (n) =>
				new Intl.NumberFormat('en-US', {
					style: 'currency',
					currency: 'USD',
					maximumFractionDigits: 2,
				}).format(n);
			const exact = (n) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(n);
			const records = data.records.sort(
				(a, b) => a.date.localeCompare(b.date) || a.agent.localeCompare(b.agent),
			);
			const agents = [...new Set(records.map((r) => r.agent))].sort();
			for (const agent of agents) {
				const o = document.createElement('option');
				o.value = agent;
				o.textContent = agent;
				$('source').append(o);
			}
			$('group').value = data.group;
			if (data.group === 'day' && new Set(records.map((r) => r.date)).size > 120)
				$('group').value = 'month';
			if (!data.costs) {
				$('metric').querySelector('[value=cost]').remove();
			}
			let view = 'total';
			function node(tag, attrs = {}, text) {
				const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
				for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
				if (text !== undefined) e.textContent = text;
				return e;
			}
			function bucket(date, group) {
				if (group === 'month') return date.slice(0, 7);
				if (group === 'day') return date;
				const d = new Date(date + 'T00:00:00Z');
				d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
				return d.toISOString().slice(0, 10);
			}
			function advance(key, group) {
				const d = new Date(key + (group === 'month' ? '-01T00:00:00Z' : 'T00:00:00Z'));
				if (group === 'month') d.setUTCMonth(d.getUTCMonth() + 1);
				else d.setUTCDate(d.getUTCDate() + (group === 'week' ? 7 : 1));
				return d.toISOString().slice(0, group === 'month' ? 7 : 10);
			}
			function details(row) {
				const models = row.models.map((m) => ({
					...m,
					cost: m.cost ?? 0,
					unallocated: m.cost === null,
				}));
				const tokens = models.reduce((s, m) => s + m.tokens, 0),
					cost = models.reduce((s, m) => s + m.cost, 0);
				const remainingTokens = Math.max(0, row.tokens - tokens),
					remainingCost = (row.cost ?? 0) - cost;
				if (remainingTokens || Math.abs(remainingCost) > 1e-8)
					models.push({
						name: 'Unallocated',
						tokens: remainingTokens,
						cost: remainingCost,
						unallocated: true,
					});
				return models;
			}
			function sumRows(rows, key) {
				const result = new Map();
				for (const r of rows) {
					const items =
						key === 'agent' ? [{ name: r.agent, tokens: r.tokens, cost: r.cost ?? 0 }] : details(r);
					for (const item of items) {
						const old = result.get(item.name) || {
							name: item.name,
							tokens: 0,
							cost: 0,
							unallocated: false,
						};
						old.tokens += item.tokens;
						old.cost += item.cost;
						old.unallocated ||= item.unallocated;
						result.set(item.name, old);
					}
				}
				return [...result.values()];
			}
			function table(target, items, metric) {
				items.sort(
					(a, b) => Math.abs(b[metric]) - Math.abs(a[metric]) || a.name.localeCompare(b.name),
				);
				const t = document.createElement('table'),
					head = t.createTHead().insertRow();
				for (const [i, label] of [
					'Name',
					'Tokens',
					...(data.costs ? ['Cost (USD)'] : []),
				].entries()) {
					const th = document.createElement('th');
					th.textContent = label;
					if (i) th.className = 'num';
					head.append(th);
				}
				const body = t.createTBody(),
					max = Math.max(1, ...items.map((r) => Math.abs(r[metric])));
				for (const item of items) {
					const row = body.insertRow(),
						name = row.insertCell();
					name.textContent = item.name;
					const bar = document.createElement('div');
					bar.className = 'bar';
					const fill = document.createElement('i');
					fill.style.width = (100 * Math.abs(item[metric])) / max + '%';
					bar.append(fill);
					name.append(bar);
					const tokens = row.insertCell();
					tokens.className = 'num';
					tokens.textContent = compact(item.tokens);
					tokens.title = exact(item.tokens);
					if (data.costs) {
						const cost = row.insertCell();
						cost.className = 'num';
						cost.textContent =
							item.unallocated && item.name !== 'Unallocated' && item.cost === 0
								? '—'
								: money(item.cost);
						cost.title = item.unallocated ? 'Some costs are not assigned to individual models' : '';
					}
				}
				$(target).replaceChildren(t);
				if (!items.length) {
					const p = document.createElement('p');
					p.textContent = 'No usage in this selection.';
					$(target).append(p);
				}
			}
			function render() {
				const source = $('source').value,
					rows = records.filter((r) => !source || r.agent === source),
					metric = $('metric').value,
					group = $('group').value;
				const totalTokens = rows.reduce((s, r) => s + r.tokens, 0),
					totalCost = rows.reduce((s, r) => s + (r.cost ?? 0), 0),
					agentTotals = sumRows(rows, 'agent'),
					modelTotals = sumRows(rows, 'model');
				$('tokens').textContent = compact(totalTokens);
				$('tokens').title = exact(totalTokens);
				$('cost').textContent = data.costs ? money(totalCost) : 'Hidden';
				$('days').textContent = exact(
					new Set(rows.filter((r) => r.tokens || r.cost).map((r) => r.date)).size,
				);
				$('sources').textContent =
					agentTotals.length + ' / ' + modelTotals.filter((m) => m.name !== 'Unallocated').length;
				$('range').textContent = rows.length
					? rows[0].date + ' — ' + rows.at(-1).date
					: 'No usage in this report';
				table('agents', agentTotals, metric);
				table('models', modelTotals, metric);
				$('note').textContent =
					'Agent dates use ' +
					data.timezone +
					' time; OpenAI Platform buckets use UTC. Cached tokens are included in token totals. Unallocated contains usage or costs without a model breakdown; OpenAI model costs are not estimated.';
				$('caption').textContent =
					(group === 'week' ? 'Weeks start Monday. ' : '') +
					'Hover or focus a bar for exact values.';
				$('chart').replaceChildren();
				$('legend').replaceChildren();
				if (!rows.length) {
					const e = document.createElement('div');
					e.className = 'empty';
					e.textContent = 'No usage to chart. Generate a report with a wider date range.';
					$('chart').append(e);
					return;
				}
				const totals =
					view === 'agent'
						? agentTotals
						: view === 'model'
							? modelTotals
							: [{ name: 'Total', tokens: totalTokens, cost: totalCost }];
				const ranked = [...totals].sort(
					(a, b) => Math.abs(b[metric]) - Math.abs(a[metric]) || a.name.localeCompare(b.name),
				);
				const names = ranked.slice(0, 6).map((r) => r.name);
				if (ranked.length > 6) names.push('Other');
				const groups = new Map();
				for (const row of rows) {
					const key = bucket(row.date, group);
					if (!groups.has(key)) groups.set(key, new Map(names.map((n) => [n, 0])));
					const values =
						view === 'agent'
							? [{ name: row.agent, ...row }]
							: view === 'model'
								? details(row)
								: [{ name: 'Total', ...row }];
					for (const item of values) {
						const name = names.includes(item.name) ? item.name : 'Other';
						groups.get(key).set(name, (groups.get(key).get(name) || 0) + (item[metric] ?? 0));
					}
				}
				const keys = [...groups.keys()].sort(),
					first = keys[0],
					last = keys.at(-1);
				for (let key = first; key <= last; key = advance(key, group)) {
					if (!groups.has(key)) groups.set(key, new Map(names.map((n) => [n, 0])));
				}
				const points = [...groups].sort((a, b) => a[0].localeCompare(b[0]));
				const max = Math.max(
						1,
						...points.map(([, v]) => [...v.values()].reduce((s, n) => s + Math.max(0, n), 0)),
					),
					min = Math.min(
						0,
						...points.map(([, v]) => [...v.values()].reduce((s, n) => s + Math.min(0, n), 0)),
					);
				const W = Math.max(500, $('chart').clientWidth),
					H = 300,
					L = 64,
					R = 14,
					T = 12,
					B = 36,
					pw = W - L - R,
					ph = H - T - B,
					y = (n) => T + ((max - n) / (max - min)) * ph,
					step = pw / points.length,
					barWidth = Math.max(0.5, step * 0.8),
					svg = node('svg', {
						viewBox: `0 0 ${W} ${H}`,
						role: 'img',
						'aria-label': `${view} ${metric} by ${group}`,
					});
				svg.append(
					node('title', {}, `${metric === 'cost' ? 'Cost in USD' : 'Token usage'} over time`),
				);
				for (let i = 0; i <= 4; i++) {
					const value = min + ((max - min) * i) / 4,
						yy = y(value);
					svg.append(
						node('line', {
							x1: L,
							y1: yy,
							x2: W - R,
							y2: yy,
							stroke: '#dce5ef',
							'stroke-width': 1,
						}),
					);
					svg.append(
						node(
							'text',
							{ x: L - 10, y: yy + 4, 'text-anchor': 'end', fill: '#586c83', 'font-size': 11 },
							metric === 'cost' ? '$' + compact(value) : compact(value),
						),
					);
				}
				svg.append(node('line', { x1: L, y1: y(0), x2: W - R, y2: y(0), stroke: '#9ba9bc' }));
				for (const [i, [date, values]] of points.entries()) {
					let positive = 0,
						negative = 0;
					for (const [j, name] of names.entries()) {
						const value = values.get(name) || 0;
						if (!value) continue;
						const start = value >= 0 ? positive : negative,
							end = start + value;
						if (value >= 0) positive = end;
						else negative = end;
						const label =
							date +
							' · ' +
							name +
							': ' +
							(metric === 'cost' ? money(value) : exact(value) + ' tokens');
						const rect = node('rect', {
							x: L + i * step + (step - barWidth) / 2,
							y: y(Math.max(start, end)),
							width: barWidth,
							height: Math.max(0.5, Math.abs(y(start) - y(end))),
							fill: colors[j],
							tabindex: 0,
							'aria-label': label,
						});
						rect.append(node('title', {}, label));
						svg.append(rect);
					}
					if (i % Math.max(1, Math.ceil(points.length / 6)) === 0)
						svg.append(
							node(
								'text',
								{
									x: L + i * step + step / 2,
									y: H - 12,
									'text-anchor': 'middle',
									fill: '#586c83',
									'font-size': 11,
								},
								date,
							),
						);
				}
				$('chart').append(svg);
				names.forEach((name, i) => {
					const key = document.createElement('span');
					key.className = 'key';
					const dot = document.createElement('i');
					dot.className = 'swatch';
					dot.style.background = colors[i];
					key.append(dot, document.createTextNode(name));
					$('legend').append(key);
				});
			}
			for (const button of document.querySelectorAll('[data-view]'))
				button.addEventListener('click', () => {
					view = button.dataset.view;
					for (const other of document.querySelectorAll('[data-view]'))
						other.setAttribute('aria-pressed', String(other === button));
					render();
				});
			for (const id of ['metric', 'group', 'source']) $(id).addEventListener('change', render);
			$('print').addEventListener('click', () => window.print());
			let resizeTimer;
			window.addEventListener('resize', () => {
				clearTimeout(resizeTimer);
				resizeTimer = setTimeout(render, 100);
			});
			render();
		</script>
	</body>
</html>
